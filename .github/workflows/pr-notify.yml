name: PR Notification

on:
  pull_request:
    types:
      - opened
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Greet the contributor
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `👋 Hello @${pr.user.login}!

            Your pull request **"${pr.title}"** has been opened successfully and is now waiting for review.

            Thank you for your contribution! 🚀`
            });

      - name: Send Email Notification
        if: ${{ secrets.RESEND_API_KEY != '' }}
        uses: actions/github-script@v7
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.NOTIFICATION_TO_EMAIL }}
        with:
          script: |
            const pr = context.payload.pull_request;

            if (!process.env.RESEND_API_KEY ||
                !process.env.FROM_EMAIL ||
                !process.env.TO_EMAIL) {

              core.warning("Missing Resend configuration.");
              return;
            }

            const response = await fetch("https://api.resend.com/emails", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${process.env.RESEND_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                from: process.env.FROM_EMAIL,
                to: [process.env.TO_EMAIL],
                subject: "🚀 New Pull Request Opened",
                html: `
                  <h2>🚀 New Pull Request Opened</h2>

                  <p><strong>Author:</strong> @${pr.user.login}</p>

                  <p>
                    A new pull request has been opened and is waiting for review.
                  </p>

                  <p>
                    <strong>Title:</strong> ${pr.title}
                  </p>

                  <p>
                    <a href="${pr.html_url}">
                      View Pull Request
                    </a>
                  </p>

                  <hr>

                  <p>
                    Repository:
                    <strong>${context.repo.owner}/${context.repo.repo}</strong>
                  </p>

                  <p>
                    This email was sent automatically by GitHub Actions.
                  </p>
                `
              })
            });

            if (!response.ok) {
              const error = await response.text();
              core.setFailed(`Resend API failed: ${error}`);
            }

            const result = await response.json();

            console.log("Email sent successfully.");
            console.log(result);