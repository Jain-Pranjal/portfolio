name: PR Notification

on:
  pull_request:
    types:
      - opened
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Greet the contributor
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const message = `
            👋 Hello @${pr.user.login}!

            Your pull request **"${pr.title}"** has been opened successfully and is now waiting for review.

            Thank you for your contribution! 🚀
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message,
            });

      - name: Send Email Notification
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.NOTIFICATION_TO_EMAIL }}

          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}

        run: |
          set -e

          if [ -z "$RESEND_API_KEY" ] || [ -z "$FROM_EMAIL" ] || [ -z "$TO_EMAIL" ]; then
            echo "❌ Missing required secrets."
            exit 0
          fi

          echo "📧 Preparing email payload..."

          PAYLOAD=$(jq -n \
            --arg from "$FROM_EMAIL" \
            --arg to "$TO_EMAIL" \
            --arg title "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg url "$PR_URL" \
            --arg number "$PR_NUMBER" \
            --arg repo "$REPO_NAME" \
            '{
              from: $from,
              to: [$to],
              subject: ("🚀 New Pull Request #" + $number + " Opened"),
              html: (
                "<h2>🚀 New Pull Request Opened</h2>" +

                "<p><strong>Repository:</strong> " + $repo + "</p>" +

                "<p><strong>PR Number:</strong> #" + $number + "</p>" +

                "<p><strong>Author:</strong> @" + $author + "</p>" +

                "<p><strong>Title:</strong> " + $title + "</p>" +

                "<p>This pull request has been opened and is waiting for review.</p>" +

                "<p><a href=\"" + $url + "\">🔗 View Pull Request</a></p>" +

                "<hr>" +

                "<p><small>This email was automatically generated by GitHub Actions.</small></p>"
              )
            }')

          echo "📤 Sending email..."

          RESPONSE=$(curl --silent --show-error --fail \
            -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "✅ Email sent successfully!"
          echo "$RESPONSE"